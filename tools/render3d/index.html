<html><body style="margin:0;background:transparent"><canvas id="c" width="1024" height="1024"></canvas>
<script src="three.min.js"></script>
<script type="module">
import { MODELS as M1, INK } from './models.js';
import { MODELS2 } from './models2.js';
import { MODELS3 } from './models3.js';
import { MODELS4 } from './models4.js';
import { MODELS5 } from './models5.js';
const MODELS = Object.assign({}, M1, MODELS2, MODELS3, MODELS4, MODELS5);
const T = THREE;
const renderer = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(1024, 1024); renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const ink = new T.Color(INK).convertSRGBToLinear();

}
window.names = Object.keys(MODELS); window.gearNames = [...Object.keys(MODELS4), ...Object.keys(MODELS5)];
window.renderItem = (name, size = 384) => {

  const ground = new T.Mesh(new T.PlaneGeometry(R * 8, R * 8), new T.ShadowMaterial({ opacity: 0 })); ground.rotation.x = -Math.PI / 2; ground.position.set(ctr.x, box.min.y - .01, ctr.z); ground.receiveShadow = true; scene.add(ground);
  scene.add(new T.HemisphereLight(0xfff4e6, 0x8a7560, .6));
  const key = new T.DirectionalLight(0xfff1de, 1.9); key.position.set(ctr.x - R * .9, ctr.y + R * 1.8, ctr.z + R * 1.6); key.target.position.copy(ctr); scene.add(key, key.target); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 9; const s = R * 1.6; Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: .1, far: R * 8 }); key.shadow.camera.updateProjectionMatrix(); key.shadow.bias = -.0004;
  const rim = new T.DirectionalLight(0xcfe3ff, .9); rim.position.set(ctr.x + R * 1.4, ctr.y + R * .7, ctr.z - R * 1.4); scene.add(rim);
  const fill = new T.DirectionalLight(0xffe2c8, .5); fill.position.set(ctr.x + R * 1.2, ctr.y + R * .5, ctr.z + R * 1.8); scene.add(fill);

  const im = x.getImageData(0, 0, 1024, 1024).data; let x0 = 1024, y0 = 1024, x1 = 0, y1 = 0;
  for (let y = 0; y < 1024; y++) for (let xx = 0; xx < 1024; xx++) if (im[(y * 1024 + xx) * 4 + 3] > 24) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const w = x1 - x0 + 1, h = y1 - y0 + 1, side = Math.max(w, h) * 1.08, f = document.createElement('canvas'); f.width = f.height = size; const fx = f.getContext('2d');
  fx.drawImage(out, x0 - (side - w) / 2, y1 + 1 - side + side * .025, side, side, 0, 0, size, size);

</script></body></html>
